name: test

# **只跑 Windows**:DSH Desktop、Vivado、ModelSim 都在这一个平台上,不做其它平台的适配。
# 只跑源码层自检(不装 DSH Desktop、不需要厂商工具):已装副本层(test:installed)与真机验收留在
# 开发者本机,因为前者要 DSH profile、后者要厂商工具。
#
# 运行时没有依赖(插件把依赖注入宿主),但**构建要 devDependencies**(tsdown / typescript),
# 所以这里需要 npm ci。
#
# 2026-10-22 审查补充:原来只有一条 `npm test`,而 7 个源码检查 import 的是 **lib 快照**
# —— 改了 src 忘记 build,测试照样全绿、发出去的仍是旧产物,CI 也不会红。
# 现在补 typecheck + build + 「重建后 lib/ 必须无差异」,把这条静默断链堵死。
on:
  push:
  pull_request:

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci（构建工具:tsdown / typescript）
        run: npm ci
      - name: typecheck（tsc --noEmit）
        run: npm run typecheck
      - name: build（tsdown:src → lib）
        run: npm run build
      # **关键防线**:lib/ 已提交入库,是用户真正加载的产物。
      # 重建后若 lib/ 有任何差异,说明提交里的产物与 src 不同步 —— 直接让 CI 红。
      - name: lib 与 src 同步（重建后 lib/ 不许有差异）
        run: git diff --exit-code -- lib
      - name: npm test（源码层:判定逻辑 / 模板 / 预设契约）
        run: npm test
