<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH 插件加载测试 — dsh-fpga-workbench</title>
<style>
  body { font: 13px/1.6 ui-monospace, Consolas, monospace; margin: 0; padding: 16px; background: #12141a; color: #dfe3ea; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .hint { opacity: .6; margin-bottom: 12px; }
  #out { white-space: pre-wrap; background: #0b0d12; border: 1px solid #262b36; border-radius: 6px; padding: 12px; min-height: 240px; }
  button { font: inherit; padding: 6px 12px; margin-bottom: 12px; background: #2a3040; color: inherit; border: 1px solid #3a4258; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<h1>DSH 客户端插件加载测试</h1>
<div class="hint">被测 bundle：<code>/lib/client.js</code>　用真实内核语义加载，不接触 DSH。</div>
<button id="copy">复制全部结果</button>
<pre id="out">正在加载…</pre>

<!-- 内核必须在 bundle 之前就位：bundle 的顶层会调用 window.__ModuleLoader__.load -->
<script src="./kernel.js"></script>

<script>
// 加载 bundle 并把结果变成一个可判定的 Promise。
//
// 不依赖解析期顺序:显式创建脚本元素,等它的 load/error 事件,再跑断言。
// 这样「bundle 没注册」只可能有两种原因(加载失败 / 顶层没执行),而不是
// 第三种含糊的「顺序不对」。
function loadBundle(src) {
  return new Promise((resolve) => {
    // 先确认内核就位:bundle 顶层要调用 window.__ModuleLoader__.load
    if (window.__ModuleLoader__ === undefined) {
      resolve({ ok: false, reason: "内核未就位:window.__ModuleLoader__ 不存在,无法承载注册" });
      return;
    }
    const tag = document.createElement("script");
    tag.src = src;
    tag.onload = () => { resolve({ ok: true }); };
    tag.onerror = () => { resolve({ ok: false, reason: `加载 ${src} 失败(404、MIME 不对或被拦)` }); };
    document.head.append(tag);
  });
}</script>

<script>
(async function run() {
  const { kernel, slots, layout, ctx, check, fatal } = window.__harness;

  // 先把 bundle 真正加载完,再断言。加载失败直接说清楚,不让它变成一句「实际 0」。
  const bundleLoad = await loadBundle("/lib/client.js");
  if (!bundleLoad.ok) {
    check(false, "bundle 脚本加载失败", bundleLoad.reason);
    const failed = window.__harness.failed;
    console.log(`\n===== 中止:${failed} 项失败 =====`);
    return;
  }
  check(true, "bundle 脚本加载成功");

  // 两个标识符不是一回事：bundle 的模块 id 是包名，面板 id/key 是 fpga-workbench。
  const MODULE_ID = "dsh-fpga-workbench";
  const PANEL_ID = "fpga-workbench";
  const LABEL = "FPGA 工作台";
  // 入口所在的槽：list 槽，侧边栏为第三方预留。
  // 侧边栏把每一行渲染成一个 glyph 行，行自身负责调用 layout.selectPanel(id)。
  const ENTRY_SLOT = "sidebar.panellist";

  document.getElementById("copy").addEventListener("click", () => {
    const text = document.getElementById("out").textContent ?? "";
    navigator.clipboard.writeText(text).then(
      () => { document.getElementById("copy").textContent = "已复制"; },
      () => { window.getSelection()?.selectAllChildren(document.getElementById("out")); }
    );
  });

  // ── 1. 注册与物化 ───────────────────────────────────────────────────────
  try {
    check(
      kernel.registry.size === 1,
      `bundle 注册了 1 个 factory（实际 ${kernel.registry.size}）`,
      kernel.registry.size === 0
        ? "脚本已加载但注册表为空 —— 顶层 window.__ModuleLoader__.load 没有执行"
        : undefined
    );
    const [id] = [...kernel.registry.keys()];
    check(id === MODULE_ID, `bundle 模块 id 等于包名（${id}）`);
    check(kernel.registry.get(id)?.factory !== undefined, "注册项带 factory");
  } catch (error) {
    fatal("第 1 步：注册", error);
  }

  let plugin = null;
  try {
    plugin = kernel.materialize(MODULE_ID);
    check(true, "物化成功（factory(require) → exports）");
  } catch (error) {
    fatal("物化失败 —— 这就是 DSH 报「没有错误信息」的那一步", error);
  }
  if (plugin === null) return;

  // ── 2. 导出面（内核据此判定它是不是插件）────────────────────────────────
  try {
    check(typeof plugin.apply === "function", "导出 apply（内核据此判定它是不是插件）");
    // 服务注入契约必须是数组:形状错了 apply 会拿到没有 slots 的 ctx 并抛 TypeError。
    check(Array.isArray(plugin.inject), `inject 是数组（实际 ${JSON.stringify(plugin.inject)}）`);
    check(
      Array.isArray(plugin.inject) && plugin.inject.every((name) => typeof name === "string"),
      "inject 每一项都是字符串（服务名）"
    );
    check(plugin.name === undefined || typeof plugin.name === "string", "name 是字符串或缺省");
  } catch (error) {
    fatal("第 2 步：导出面", error);
  }

  // ── 3. 父槽已声明时 apply 的行为 ────────────────────────────────────────
  let row = null;
  let panel = null;
  try {
    slots.entries.clear();
    slots.injectCalls.length = 0;
    slots.declare(ENTRY_SLOT);
    slots.declare("main");
    // apply 会拉一次注册表来解析目标工作区,所以必须在它之前把 fetch 替换掉。
    const FETCHED = { workspace: "C:\\Work\\dsh-fpga-workbench", projects: [] };
    window.fetch = () => Promise.resolve({ ok: true, status: 200, json: () => Promise.resolve(FETCHED) });
    plugin.apply(ctx);

    row = (slots.entries.get(ENTRY_SLOT) ?? [])[0];
    panel = (slots.entries.get("main") ?? [])[0];

    check(row !== undefined, `往 ${ENTRY_SLOT} 注册了入口`);
    check(panel !== undefined, "往 main 注册了面板");
    if (row !== undefined) {
      check(row.options.id === PANEL_ID, `入口 id 正确（${row.options.id}）`);
      check(typeof row.options.order === "number", `入口带 order（${row.options.order}）`);
      check(row.options.label === LABEL, `入口 label 正确（${row.options.label}）`);
      check(typeof row.component === "function", "入口带组件");
    }
    if (panel !== undefined) {
      check(panel.options.key === PANEL_ID, `面板 key 正确（${panel.options.key}）`);
      check(typeof panel.component === "function", "面板带组件");
    }
    // 最容易崩的点：两处不一致时点击会抛 not registered
    check(
      row !== undefined && panel !== undefined && row.options.id === panel.options.key,
      "入口 id === 面板 key（不一致时点击会抛 not registered）"
    );
  } catch (error) {
    fatal("第 3 步：apply（父槽已声明）", error);
  }

  // ── 4. 父槽尚未声明时 apply 必须等待而不是抛错 ──────────────────────────
  try {
    slots.entries.clear();
    slots.declarations.clear();
    slots.waiting.clear();
    slots.injectCalls.length = 0;

    plugin.apply(ctx);
    check(slots.entries.size === 0, "父槽未声明时没有注册任何行（挂起等待）");
    check(slots.injectCalls.includes(ENTRY_SLOT), `apply 请求了入口槽（${slots.injectCalls.join(", ")}）`);

    slots.declare(ENTRY_SLOT);
    slots.declare("main");
    const lateRow = (slots.entries.get(ENTRY_SLOT) ?? [])[0];
    const latePanel = (slots.entries.get("main") ?? [])[0];
    check(lateRow !== undefined && latePanel !== undefined, "父槽后来声明时，挂起的注册被执行");

    // 等最后一次 apply 的注册表 fetch 落地。
    // 每次 apply 都会重新解析并重新绑定 startSession，所以必须等**最后一次**；
    // 只等第一次会让面板用上尚未解析完成的绑定，测试就会误报 undefined。
    await new Promise((resolve) => setTimeout(resolve, 0));
  } catch (error) {
    fatal("第 4 步：apply（父槽后声明）—— 这是官方插件依赖的等待语义", error);
  }

  // ── 5. 点击路径：切进去、切回来 ────────────────────────────────────────
  try {
    layout.selectPanel(PANEL_ID);
    check(layout.activePanelId === PANEL_ID, "selectPanel 能切到本面板");
    layout.selectPanel(null);
    check(layout.activePanelId === null, "selectPanel(null) 能切回会话");

    let threw = false;
    try {
      layout.selectPanel("definitely-not-registered");
    } catch {
      threw = true;
    }
    check(threw, "selectPanel 对未注册面板会抛错（说明上面的配对检查有意义）");
  } catch (error) {
    fatal("第 5 步：selectPanel", error);
  }

  // ── 6. 入口字形：侧边栏把行渲染成 glyph，切换由侧边栏自己负责 ────────────
  try {
    if (row === null) throw new Error("第 3 步没有拿到入口行，无法测试字形");
    const glyph = row.component({ size: 18, active: false });
    check(glyph?.__element === true, "入口字形返回元素（不是 undefined）");
    check(glyph?.type === "svg", `入口字形是 svg（实际 ${String(glyph?.type)}）`);
    check(glyph?.props?.width === 18, `入口字形采用传入的 size（${String(glyph?.props?.width)}）`);
    check(row.component({})?.props?.width === 18, "不传 size 时有合理默认值");

    // 反向防呆：侧边栏行不是按钮。若实现退回"自己造 button + 自己切换"，
    // 就说明它又在依赖槽不提供的 props。
    check(glyph?.type !== "button", "入口不是自造按钮（切换由侧边栏行负责）");
  } catch (error) {
    fatal("第 6 步：入口字形", error);
  }

  // ── 7. 面板：会话选择器（列出本工作台的会话，点一个就进去）─────────────────
  try {
    if (panel === null) throw new Error("第 3 步没有拿到面板，无法测试渲染");
    const originalFetch = window.fetch;
    window.fetch = () =>
      Promise.resolve({
        ok: true,
        status: 200,
        json: () => Promise.resolve({ workspace: "C:\\Work\\dsh-fpga-workbench", projects: [{ name: "m1", path: "C:\\Work\\demo\\m1", stage: "sim" }] })
      });
    try {
      const element = panel.component();
      check(element?.__element === true, "面板组件返回元素");
      check(document.querySelector("style[data-fpga-workbench]") !== null, "面板注入了自己的样式节点");

      const workspace = window.__harness.uiWorkspace;

      // 回归测试：工作区列表在 apply 时还没就绪，到点击时才就绪。
      // 线上出过的 bug 就是「只在 apply 时解析一次 workspaceId」—— 那时列表是空的，
      // 拿到 undefined 就永远缓存着，会话落到「当前/最近」的分组（用户报的正是这个）。
      check(workspace.ready === false, "apply 期间工作区列表尚未就绪（模拟真实时序）");
      workspace.ready = true;

      // 面板是选择器，不是「挂载即新建」：挂载时不该产生任何会话动作，
      // 否则用户永远看不到这个列表（会被立刻跳走）。
      check(workspace.calls.length === 0, `面板挂载时不自动新建会话（实际 ${workspace.calls.length} 次）`);
      check(workspace.opened.length === 0, "面板挂载时不自动打开会话");

      // 递归收集按钮
      const buttons = [];
      (function walk(node) {
        if (node === null || typeof node !== "object") return;
        if (node.__element === true && node.type === "button") buttons.push(node);
        for (const child of node.children ?? []) walk(child);
      })(element);

      // 会话列表：只列本工作台的会话，最近的在前
      const sessionButtons = buttons.filter((b) => b.props?.className === "fpga-wb-session");
      check(sessionButtons.length === 2, `列出本工作台的 2 个会话（实际 ${sessionButtons.length}）`);
      check(
        !sessionButtons.map((b) => JSON.stringify(b.children)).join(" ").includes("别人的会话"),
        "没有混进别的工作区的会话"
      );

      sessionButtons[0].props.onClick();
      check(workspace.opened.length === 1, `点会话会打开它（实际 ${workspace.opened.length} 次）`);
      check(workspace.opened[0] === "s-new", `打开的是被点的那一个（实际 ${String(workspace.opened[0])}）`);

      // 「新建 FPGA 会话」按钮：建在注册表 workspace 路径对应的那个工作区里
      const createButton = buttons.find((b) => b.props?.className === "fpga-wb-action");
      check(createButton !== undefined, "面板里有「新建 FPGA 会话」按钮");
      createButton.props.onClick();
      check(workspace.calls.length === 1, `点按钮新建一次会话（实际 ${workspace.calls.length} 次）`);
      check(
        workspace.calls[0] === "ws-fpga",
        `会话落在 FPGA 工作台对应的工作区（实际 ${String(workspace.calls[0])}）`
      );
    } finally {
      window.fetch = originalFetch;
    }
  } catch (error) {
    fatal("第 7 步：面板组件", error);
  }

  const failed = window.__harness.failed;
  console.log(failed === 0 ? "\n===== 全部通过 =====" : `\n===== ${failed} 项失败 =====`);
})();
</script>
</body>
</html>
