    <rect x="220" y="220" width="584" height="584" rx="96" fill="url(#body)" stroke="url(#edge)" stroke-width="12"/>
    <rect x="270" y="270" width="484" height="484" rx="68" fill="#0B1642" stroke="#3E5FC4" stroke-width="8"/>
    <rect x="360" y="360" width="304" height="304" rx="44" fill="url(#core)" stroke="#5DE3C5" stroke-width="10"/>

    <path d="M404 512H472L512 420L580 604L632 484H676L712 552H748" stroke="#8CF6D6" stroke-opacity="0.22" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M404 512H472L512 420L580 604L632 484H676L712 552H748" stroke="url(#wave)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M320 352H376M320 672H376M648 352H704M648 672H704" stroke="#8EA6C4" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
    <circle cx="512" cy="320" r="12" fill="#5DE3C5"/>
    <circle cx="512" cy="704" r="12" fill="#5DE3C5" opacity="0.72"/>
