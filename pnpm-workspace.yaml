# pnpm 的安装行为（2026-10-22 审查 N4）
#
# ## 为什么要关掉 autoInstallPeers
#
# 本插件的三个 `peerDependencies`（`@deepseek-ai/dsh-settings` /
# `dsh-system-prompt` / `schemastery`）**运行时由宿主提供** —— 插件声明它们
# 只是表达"我要求宿主有这些"，绝不能真装进自己的依赖树。
#
# pnpm 默认 `autoInstallPeers: true`：peer 缺失就替你装。于是生成 lockfile 时
# 三个 peer 连同**整个宿主依赖树**（cordis / dsh-app-boot / dsh-session …）都被
# 写进 `importers..dependencies` —— 当时的 lockfile 有 1695 行、"cordis" 出现 271 次。
# 关掉后是 971 行、0 次。
#
# 后果不只是"文件难看"：
#   · 插件包会连宿主一起被安装（重复的 cordis 实例 → 挂不到同一个插件系统）；
#   · CI/新机器上的安装变慢，且容易因宿主包的可见性而失败；
#   · `--frozen-lockfile` 校验的是一份"其实不需要的"依赖图。
#
# ## 为什么写在这里而不是 .npmrc
#
# pnpm 11 起，这个开关不再从 `.npmrc` 读（实测：`.npmrc` 里写
# `auto-install-peers=false` 无效），而是**只认 `pnpm-workspace.yaml` 顶层**，
# 且键名必须是 camelCase。「放在 `settings:` 子键下」实测也无效。
#
# 校验：`node tools/check-workflow.mjs` 会断言 lockfile 的 `importers` 段
# 不含 package.json 里的 peerDependencies。

autoInstallPeers: false

# ## 依赖布局：hoisted（2026-10-22 第六轮审查后加）
#
# 用**平铺**布局（像 npm）而不是 pnpm 默认的 isolated 布局。
#
# ### 为什么
#
# 第六轮审查报告称：`autoInstallPeers: false` 会触发 pnpm 的链接建立缺陷 ——
# `.pnpm/` 下内容目录齐全但一个链接都不建，install 静默退 0，随后 build 挂在
# `ERR_MODULE_NOT_FOUND: tinyexec`。
#
# **我在本机没能复现**（pnpm 11.24.0 / node 24.19.0）：
#   · 全新克隆 + 空 store，重复 4 次，tsdown 虚拟目录都是 16 项、build 全过；
#   · A/B 对照（false / true / 不写）：三者链接数完全相同（tsdown 16 / .pnpm 34 / 顶层 7）。
# 所以这更像是**审查环境特有**的问题（沙箱或 Windows 链接权限），不是本仓库的缺陷。
#
# ### 那为什么还是加
#
# 因为代价极小、收益是"换一个不依赖软链接的布局"：
#   · 本仓库只有 5 个 devDependencies、**零**运行时依赖、无 workspace ——
#     isolated 布局的版本隔离在这里没有实际价值；
#   · 平铺布局不建依赖间软链接，因此**不受那类链接问题影响**；
#   · `pnpm-lock.yaml` 不受影响（nodeLinker 不进 lockfile），可复现性不变。
#
# 换句话说：这不是"修一个不存在的 bug"，而是**在当前收益/成本下选一个更抗环境的选项**。
# 若将来这个仓库长成多包 workspace，再评估回 isolated。
nodeLinker: hoisted

