name: test

# **只跑 Windows**:DSH Desktop、Vivado、ModelSim 都在这一个平台上,不做其它平台的适配。
# 只跑源码层自检(不装 DSH Desktop、不需要厂商工具):已装副本层(test:installed)与真机验收留在
# 开发者本机,因为前者要 DSH profile、后者要厂商工具。
#
# 运行时没有依赖(插件把依赖注入宿主),但**构建要 devDependencies**(tsdown / typescript),
# 所以 CI 必须先装依赖。
#
# ## 为什么用 pnpm 而不是 npm ci
#
# 2026-10-22 第三次审查(N1)：原来写 `npm ci`，而仓库**没有提交任何 lockfile**
# （`package-lock.json` 与 `pnpm-lock.yaml` 都在 .gitignore 里）—— `npm ci` 无 lockfile
# 直接 EUSAGE 退 1，**CI 第一步就必红**，H3 那条"lib 与 src 同步"防线等于没上。
#
# 这个仓库实际就是用 pnpm 装的（`node_modules/.pnpm`、`pnpm-lock.yaml` 都在）。
# 所以：CI 用 pnpm + `--frozen-lockfile`，并把 `pnpm-lock.yaml` 提交入库 ——
# lockfile 进版本库才能保证"CI 装到的依赖版本与开发者一致"，也是 `--frozen-lockfile` 的前提。
#
# ## 防线
#
# 原来只有一条 `npm test`，而 7 个源码检查 import 的是 **lib 快照** —— 改了 src 忘记
# build，测试照样全绿、发出去仍是旧产物，CI 也不会红。现在补 typecheck + build +
# 「重建后 lib/ 不许有差异」，把这条静默断链堵死。
on:
  push:
  pull_request:

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # **不要写 `version:`**（2026-10-22 审查 N3）。
        #
        # 这个 action 的版本判定是**字符串全等**：只要 `version` 和 `packageManager`
        # 同时存在且不逐字相等，它就抛
        #   `Multiple versions of pnpm specified: ...`
        # 然后整个 job 在第一步就红。
        #
        # 我们 package.json 里已经有 `packageManager: "pnpm@11.24.0"`，action 会自读它。
        # 再写 `version: 11` → `"11" !== "11.24.0"` → 抛错；
        # 写 `version: 11.24.0` 则变成两处手工同步，迟早漂移。
        # 所以唯一的正确做法是**留空**，只保留 packageManager 这一处来源。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm install --frozen-lockfile（构建工具:tsdown / typescript）
        run: pnpm install --frozen-lockfile
      - name: typecheck（tsc --noEmit）
        run: pnpm run typecheck
      - name: build（tsdown:src → lib）
        run: pnpm run build
      # **关键防线**:lib/ 已提交入库,是用户真正加载的产物。
      # 重建后若 lib/ 有任何差异,说明提交里的产物与 src 不同步 —— 直接让 CI 红。
      - name: lib 与 src 同步（重建后 lib/ 不许有差异）
        run: git diff --exit-code -- lib
      - name: test（源码层:判定逻辑 / 模板 / 预设契约）
        run: pnpm test
      # **Q-05**：Tcl 检查必须**真跑**，不能因为 runner 上没有 tclsh 就 SKIP 还绿。
      #
      # `pnpm test` 里那一项是"没解释器就跳过"（本地开发友好）。
      # 这一条是发布门禁：解释器缺失或断言失败都必须让 job 红。
      # GitHub 的 Windows runner 自带 Git for Windows，其 MSYS 环境里有 tclsh。
      - name: Tcl 门禁（无解释器即失败）
        run: node tools/check-board-tcl.mjs --require
      # 同理：历史隐私扫描默认不在 `pnpm test` 里（会因历史内容阻塞日常 CI），
      # 但发布前必须核一次。这里用非阻塞方式记录，命中时只警告不红 ——
      # 因为"历史里有旧痕迹"是**既成事实**，让它红只会逼人把这项关掉。
      - name: 历史隐私扫描（报告用，不阻塞）
        run: node tools/check-privacy-history.mjs
        continue-on-error: true
